name: Wording change
description: Propose a change to the text of the Code of Conduct.
title: "[Wording] "
labels: ["wording"]
body:
  - type: markdown
    attributes:
      value: |
        **This is not a reporting channel.** Do not describe incidents or name people here.
        To report a concern, email [conduct@millibar.io](mailto:conduct@millibar.io).
  - type: dropdown
    id: section
    attributes:
      label: Section
      options:
        - Our pledge
        - Scope
        - What we encourage
        - What we do not accept
        - Power and influence
        - Events and travel
        - Reporting
        - Addressing and repairing harm
        - Fair process
        - Review
        - Attribution
        - New section
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Kind of change
      options:
        - Clarification (meaning stays the same)
        - Change to meaning (rules, scope, reporting or enforcement)
        - Typo, link or formatting
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Current text
      description: Quote the text you want to change, if any.
      render: markdown
  - type: textarea
    id: proposed
    attributes:
      label: Proposed text
      render: markdown
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: What problem does this solve? Who does it help?
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: This issue does not describe a real incident or identify any person.
          required: true
