name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check tag matches CODE_OF_CONDUCT.md version
        run: |
          version=$(sed -nE '1s/^<!-- version: ([0-9.]+) .*/\1/p' CODE_OF_CONDUCT.md)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match CODE_OF_CONDUCT.md version $version"
            exit 1
          fi
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in v0.*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes $prerelease \
            CODE_OF_CONDUCT.md translations/*.md
